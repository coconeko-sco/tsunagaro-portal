<header class="topbar">
    <div class="topbar-inner" style="position: relative;">
        <div class="brand-group">
            <div class="brand">つながろ</div>
            {% if is_coming_soon %}<span class="coming-soon">Coming soon...</span>{% endif %}
        </div>
        <!-- id="menu-toggle" をここだけに配置 -->
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="メニューを開く">
            <span></span><span></span><span></span>
        </button>
        <!-- class="nav-menu" を class="nav-menu" に統一 -->
        <nav class="nav-menu" id="nav-menu">
            {{ NAV_MENU_HTML | safe }}
        </nav>
    </div>
</header>
