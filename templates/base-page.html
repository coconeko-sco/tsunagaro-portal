<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | つながろ</title>
    <meta name="description" content="{{ description }}">
    
    <!-- ファビコン -->
    <link rel="icon" href="{{ root_path }}/favicon.ico" sizes="any" />
    <link rel="icon" href="{{ root_path }}/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="{{ root_path }}/apple-touch-icon.png" />
    
    <!-- SNS/SEO -->
    <meta property="og:site_name" content="つながろ" />
    <meta property="og:title" content="{{ title }} - つながろ" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <link rel="canonical" href="{{ canonical_url }}" />
    
    <link rel="stylesheet" href="{{ root_path }}/style.css">
    
    <!-- Google Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6LHJQFWKTQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6LHJQFWKTQ');
    </script>
</head>
<body>
    {% include 'components/header.html' %}
    
    <main class="container">
        <h1>{{ heading }} {% if is_coming_soon %}<span class="badge" style="background:#f97316; color:#fff; padding:2px 8px; border-radius:4px; font-size:0.8rem; vertical-align:middle;">Coming Soon</span>{% endif %}</h1>
        <div class="content-area">
            {{ content_html | safe }}
        </div>
    </main>

    {% include 'components/footer.html' %}

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // .menu-button または .menu-toggle のどちらでも見つかるようにする
        const btn = document.querySelector('.menu-button') || document.querySelector('.menu-toggle');
        // #site-menu または #nav-menu のどちらでも見つかるようにする
        const menu = document.getElementById('site-menu') || document.getElementById('nav-menu');
        
        if (btn && menu) {
            btn.addEventListener('click', () => {
                menu.hidden = !menu.hidden;
                // aria-expanded属性があれば連動させる
                const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', String(!isExpanded));
            });
        }
    });
</script>
</body>
</html>
