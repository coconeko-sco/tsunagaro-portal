<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CITY_NAME}}のおすすめ | つながろ</title>
    <link rel="stylesheet" href="../../style.css">
    <!-- 検索・URL・ファビコン設定 -->
    <meta name="description" content="{{CITY_NAME}}の地域情報・求人・サポート情報をまとめたページです。" />
    <link rel="canonical" href="https://tsunagaro-portal.com/fukuoka/{{CITY_ID}}/{{CITY_ID}}.html" />
    <meta property="og:site_name" content="つながろ" />
    <meta property="og:title" content="{{CITY_NAME}} - つながろ" />
    <meta property="og:description" content="{{CITY_NAME}}の地域情報・求人・店舗サポート情報" />
    <meta property="og:url" content="https://tsunagaro-portal.com/fukuoka/{{CITY_ID}}/{{CITY_ID}}.html" />
    <meta property="og:image" content="https://tsunagaro-portal.com/favicon.ico" />
    <meta property="og:type" content="article" />

    <link rel="icon" href="https://tsunagaro-portal.com/favicon.ico" sizes="any" />
    <link rel="icon" href="https://tsunagaro-portal.com/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://tsunagaro-portal.com/apple-touch-icon.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "つながろ（{{CITY_NAME}}）",
      "url": "https://tsunagaro-portal.com/fukuoka/{{CITY_ID}}/{{CITY_ID}}.html",
      "image": "https://tsunagaro-portal.com/favicon.ico",
      "areaServed": "{{CITY_NAME}}"
    }
    </script>
    
</head>
<body>
    {% include 'components/header.html' %}

    <main class="container">
        <section class="hero">
            <img src="{{HERO_IMAGE}}" alt="" class="card-img" style="height: 240px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; width: 100%;" onerror="this.style.display='none'">
            <h1>{{CITY_NAME}}のおすすめ {% if is_coming_soon %}<span class="badge">Coming Soon</span>{% endif %}</h1>
            <p>{{HERO_DESCRIPTION}}</p>
        </section>

        <div class="region-grid">
            {{CARD_LIST_HTML}}
        </div>
    </main>

    {% include 'components/footer.html' %}
    <div id="contact-modal" class="modal-overlay" hidden onclick="closeModalOnOverlay(event, 'contact-modal')">
        <div class="modal-content">
            <button type="button" class="modal-close" onclick="closeModal('contact-modal')">&times;</button>
            <h2>お問い合わせ</h2>
            <p class="modal-lead">ご質問・ご掲載に関するご相談は、下記フォームよりお問い合わせください。（※ダミーフォームです）</p>
            <form class="dummy-form" onsubmit="event.preventDefault(); alert('現在準備中です。');">
                <div class="form-group">
                    <label>お名前（必須）</label>
                    <input type="text" placeholder="山田 太郎" required />
                </div>
                <div class="form-group">
                    <label>メールアドレス（必須）</label>
                    <input type="email" placeholder="example@tsunagaro-portal.com" required />
                </div>
                <div class="form-group">
                    <label>お問い合わせ内容</label>
                    <textarea rows="4" placeholder="ご質問や掲載のご依頼内容をご記入ください。"></textarea>
                </div>
                <button type="submit" class="submit-btn">送信する（ダミー）</button>
            </form>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');
        if (toggleBtn && navMenu) {
            toggleBtn.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.hidden = false;
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.hidden = true;
        }

        function closeModalOnOverlay(event, id) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModal(id);
            }
        }
    </script>
</body>
</html>
