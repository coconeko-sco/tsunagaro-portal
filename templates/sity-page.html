<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{CITY_NAME}}のおすすめ | つながろ</title>
    <link rel="stylesheet" href="../../style.css" />
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-group">
                <div class="brand">つながろ</div>
                <span class="coming-soon">Coming soon...</span>
            </div>
            <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu-panel" id="site-menu" hidden>
                <a href="../../index.html">TOP</a>
                <a href="./iizuka.html">飯塚</a>
                <a href="#">田川</a>
                <a href="#">直方</a>
                <a href="#">求人</a>
                <a href="#">商いマッチ</a>
                <a href="#">ツール</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-image">
                <img src="{{HERO_IMAGE}}" alt="{{CITY_NAME}}のおすすめ" />
            </div>
            <div class="hero-copy">
                <h1>{{CITY_NAME}}のおすすめ</h1>
                <p>{{HERO_DESCRIPTION}}</p>
            </div>
        </section>

        <section class="card-list">
            {{CARD_LIST_HTML}}
        </section>
    </main>

    <script>
        const menuButton = document.querySelector('.menu-button');
        const siteMenu = document.querySelector('#site-menu');

        menuButton.addEventListener('click', () => {
            const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!isOpen));
            menuButton.setAttribute('aria-label', isOpen ? 'メニューを開く' : 'メニューを閉じる');
            siteMenu.hidden = isOpen;
        });
    </script>
</body>
</html>
