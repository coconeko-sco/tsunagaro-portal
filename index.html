<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つながろ - 地域を選ぶ</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-group">
                <div class="brand">つながろ</div>
                <span class="coming-soon">Coming soon...</span>
            </div>
            <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu-panel" id="site-menu" hidden>
                <a href="fukuoka/iizuka/iizuka.html">飯塚</a>
                <a href="#">田川</a>
                <a href="#">直方</a>
                <a href="#">求人</a>
                <a href="#">商いマッチ</a>
                <a href="#">ツール</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>地域を選ぶ</h1>
            <p>地域ごとのおすすめを選んで、地元の話題を見ていきましょう。</p>
        </section>

        <section class="region-grid">
            
            <article class="region-card">
                <h3>飯塚</h3>
                <p>グルメ・イベント・暮らしの話題をまとめた飯塚のおすすめページ。</p>
                <a href="fukuoka/iizuka/iizuka.html">飯塚を見る</a>
            </article>
        
            <article class="region-card">
                <h3>田川</h3>
                <p>地元の小さな発見と、のんびり楽しめる話題をまとめるページ。</p>
                <a href="#">田川を見る</a>
            </article>
        
            <article class="region-card">
                <h3>直方</h3>
                <p>町の空気と暮らしに寄り添うおすすめ情報を載せる地域ページ。</p>
                <a href="#">直方を見る</a>
            </article>
        
        </section>
    </main>
    <script>
        const menuButton = document.querySelector('.menu-button');
        const siteMenu = document.querySelector('#site-menu');

        menuButton.addEventListener('click', () => {
            const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!isOpen));
            menuButton.setAttribute('aria-label', isOpen ? 'メニューを開く' : 'メニューを閉じる');
            siteMenu.hidden = isOpen;
        });
    </script>
</body>
</html>
