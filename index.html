<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つながろ - 地域を選ぶ</title>
    <style>
        :root {
            --brand: #ff7a3d;
            --brand-dark: #d85d22;
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #ebeff5;
            --text: #1f2937;
            --sub: #58657a;
            --shadow: 0 14px 34px rgba(17, 24, 39, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #fffaf7 0%, var(--bg) 25%, var(--bg) 100%);
            color: var(--text);
        }
        a { text-decoration: none; color: inherit; }
        .topbar {
            background: linear-gradient(135deg, var(--brand) 0%, #ff9a75 55%, #f2bb93 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 130, 80, 0.18);
        }
        .topbar-inner {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
        }
        .brand-group {
            display: flex;
            align-items: baseline;
            gap: 12px;
            min-width: 0;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .coming-soon {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 5px 11px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            background: #fff3a3;
            color: #713b12;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(107, 48, 10, 0.2);
            animation: coming-soon-pulse 2.8s ease-in-out infinite;
        }
        .coming-soon::before {
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: #e05a22;
            box-shadow: 0 0 0 3px rgba(224, 90, 34, 0.18);
            content: "";
        }
        @keyframes coming-soon-pulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .menu-button {
            width: 44px;
            height: 44px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex: 0 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            cursor: pointer;
        }
        .menu-button span {
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: currentColor;
        }
        .menu-button:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.75);
            outline-offset: 3px;
        }
        .menu-panel {
            position: absolute;
            top: calc(100% - 8px);
            right: 20px;
            z-index: 2;
            width: min(260px, calc(100vw - 40px));
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 16px 32px rgba(80, 42, 20, 0.18);
        }
        .menu-panel[hidden] {
            display: none;
        }
        .menu-panel a {
            display: block;
            padding: 11px 12px;
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 700;
        }
        .menu-panel a:hover,
        .menu-panel a:focus-visible {
            background: #fff2ea;
            color: var(--brand-dark);
            outline: none;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }
        .hero {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 28px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }
        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: -0.06em;
        }
        .hero p {
            margin: 0;
            color: var(--sub);
            line-height: 1.8;
            font-size: 0.96rem;
        }
        .region-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }
        .region-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
        }
        .region-card h3 {
            margin: 0 0 8px;
            font-size: 1.5rem;
            letter-spacing: -0.04em;
        }
        .region-card p {
            margin: 0 0 16px;
            color: var(--sub);
            line-height: 1.8;
            font-size: 0.9rem;
        }
        .region-card a {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--brand);
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
        }
        @media (max-width: 760px) {
            .region-grid { grid-template-columns: 1fr; }
            .brand-group { gap: 8px; }
            .coming-soon {
                min-height: 27px;
                padding: 4px 8px;
                font-size: 0.66rem;
            }
            .coming-soon::before {
                width: 6px;
                height: 6px;
                margin-right: 5px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-group">
                <div class="brand">つながろ</div>
                <span class="coming-soon">Coming soon...</span>
            </div>
            <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu-panel" id="site-menu" hidden>
                <a href="fukuoka/iizuka/iizuka.html">飯塚</a>
                <a href="#">田川</a>
                <a href="#">直方</a>
                <a href="#">求人</a>
                <a href="#">商いマッチ</a>
                <a href="#">ツール</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>地域を選ぶ</h1>
            <p>地域ごとのおすすめを選んで、地元の話題を見ていきましょう。</p>
        </section>

        <section class="region-grid">
            
            <article class="region-card">
                <h3>飯塚</h3>
                <p>グルメ・イベント・暮らしの話題をまとめた飯塚のおすすめページ。</p>
                <a href="fukuoka/iizuka/iizuka.html">飯塚を見る</a>
            </article>
        
            <article class="region-card">
                <h3>田川</h3>
                <p>地元の小さな発見と、のんびり楽しめる話題をまとめるページ。</p>
                <a href="#">田川を見る</a>
            </article>
        
            <article class="region-card">
                <h3>直方</h3>
                <p>町の空気と暮らしに寄り添うおすすめ情報を載せる地域ページ。</p>
                <a href="#">直方を見る</a>
            </article>
        
        </section>
    </main>
    <script>
        const menuButton = document.querySelector('.menu-button');
        const siteMenu = document.querySelector('#site-menu');

        menuButton.addEventListener('click', () => {
            const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!isOpen));
            menuButton.setAttribute('aria-label', isOpen ? 'メニューを開く' : 'メニューを閉じる');
            siteMenu.hidden = isOpen;
        });
    </script>
</body>
</html>
